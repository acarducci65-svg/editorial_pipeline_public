name: Security
on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  zero-leak-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/zero_leak_scan.py
