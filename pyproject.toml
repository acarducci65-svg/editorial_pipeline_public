[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "editorial-pipeline"
version = "1.1.0"
description = "A human-governed editorial pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
rag = ["notebooklm-mcp-cli; python_version >= '3.11'"]
social = ["jinja2>=3.1", "playwright>=1.40"]
audio = ["mutagen>=1.47", "edge-tts>=6.1.0"]
all = ["jinja2>=3.1", "playwright>=1.40", "mutagen>=1.47", "edge-tts>=6.1.0"]
dev = [
    "tomli>=2.0.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "jinja2>=3.1",
]

[project.scripts]
editorial = "editorial_pipeline.__main__:main"
editorial-pipeline = "editorial_pipeline.__main__:main"

[tool.hatch.build.targets.sdist]
include = ["/src/editorial_pipeline", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/templates", "/editorial.example.toml", "/examples", "/skills"]

[tool.hatch.build.targets.wheel]
packages = ["src/editorial_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "editorial_pipeline/_skills"
"templates" = "editorial_pipeline/_scaffold/templates"
"editorial.example.toml" = "editorial_pipeline/_scaffold/editorial.example.toml"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".coord", ".agents"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
